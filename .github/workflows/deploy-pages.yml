# Builds the EcoMove PWA and publishes it to GitHub Pages on every push to main.
# Repository variables (Settings → Secrets and variables → Actions → Variables) — PUBLIC values only:
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
# Never add GEMINI_API_KEY or other server secrets here; they live in Supabase Edge Function secrets.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx jest --ci
      # A repository named "<owner>.github.io" is served at the domain root (https://ecomoveai.github.io/);
      # any other repository is served under /<repo-name>/.
      - name: Base path
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "EXPO_PUBLIC_BASE_URL=" >> "$GITHUB_ENV"
          else
            echo "EXPO_PUBLIC_BASE_URL=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi
      - name: Build PWA
        run: npm run build:web -- --target=github-pages
        env:
          CI: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
