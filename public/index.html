<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="EcoMove AI: understand and reduce the carbon footprint of your everyday travel, with transparent, reproducible emission estimates." />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1F7A4D" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EcoMove" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #f5f7f4;
        color: #16201a;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1512;
          color: #e7eee9;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      .boot {
        margin: auto;
        text-align: center;
        font-size: 15px;
        opacity: 0.75;
      }
    </style>
  </head>

  <body>
    <noscript>EcoMove AI needs JavaScript to run. Your data stays in your browser or your account.</noscript>
    <!-- Replaced by the app once it starts. Shown while the app loads (or if it fails to load). -->
    <div id="root"><p class="boot">Loading EcoMove AI…</p></div>
  </body>
</html>
